<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metalúrgica Sulfer | Controle de Ferramentas</title>

<style>
:root{--blue:#174b78;--ink:#17212b;--muted:#687887;--line:#dce3ea;--bg:#eef2f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,sans-serif}.wrap{max-width:720px;margin:20px auto;padding:12px}.app{background:#fff;border:1px solid #d8e0e8;border-radius:20px;overflow:hidden;box-shadow:0 8px 28px #15283b18}header{background:var(--blue);color:#fff;padding:20px}header small{letter-spacing:2px;opacity:.85}header h1{font-size:23px;margin:8px 0 4px}.sub{color:#dce9f5;font-size:13px}nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}button{cursor:pointer;border:1px solid #cbd5df;border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink);font-weight:600}button.active,.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}main{padding:17px;min-height:480px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid var(--line);border-radius:13px;padding:14px;margin:9px 0;background:#fbfcfd}.metric{font-size:28px;font-weight:bold}.muted{color:var(--muted);font-size:13px}.row{padding:12px 0;border-bottom:1px solid #e5eaf0;display:flex;justify-content:space-between;gap:12px;align-items:center}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5df;border-radius:9px;margin:5px 0 12px;font:15px Arial}textarea{min-height:75px}label{font-size:13px;font-weight:bold;display:block}.primary{width:100%;margin-top:8px}.tag{font-size:11px;background:#edf2f7;border-radius:20px;padding:5px 8px;white-space:nowrap}.warn{background:#fff5dc;color:#805600}.ok{background:#e7f5eb;color:#176534}.danger{background:#fdeaea;color:#9b2525}.hidden{display:none!important}footer{padding:14px;text-align:center;color:#71808e;font-size:12px;border-top:1px solid var(--line)}#reader{width:100%;max-width:440px;margin:10px auto} .note{padding:11px;border-radius:10px;background:#f1f5f9;font-size:13px;line-height:1.45}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.sectiontitle{margin-top:22px}
</style></head><body><div class="wrap"><div class="app"><header><small>METALÚRGICA SULFER</small><h1>Controle de Ferramentas</h1><div class="sub">Protótipo com leitura de QR Code e aprovação do almoxarifado</div></header>
<nav id="nav"><button data-page="home" class="active">Início</button><button data-page="tools">Ferramentas</button><button data-page="qr">Ler QR Code</button><button data-page="request">Solicitar</button><button data-page="approval">Aprovações</button><button data-page="history">Histórico</button></nav><main id="main"></main><footer>DEMONSTRAÇÃO — dados locais deste navegador. Leitor QR usa o recurso nativo do navegador; câmera exige HTTPS/localhost. Ainda não integrado ao Excel ou Microsoft 365.</footer></div></div>
<script>
const tools=[
['MRT-001','Martelo Perfurador/Rompedor','Vonder','Em uso',''],['MRT-002','Martelo Perfurador/Rompedor','DeWalt','Em uso',''],['PAR-001','Parafusadeira de Impacto','DeWalt','Em uso',''],['FRE-001','Furadeira de Mandril 16"','DeWalt','Em uso',''],['FRE-002','Furadeira de Mandril 16"','Vonder','Disponível',''],['LXP-001','Lixadeira Pequena 4,5','Stanley','Disponível','Lucas'],['LXP-002','Lixadeira Pequena 4,5','Vonder','Disponível',''],['LXP-003','Lixadeira Pequena 4,5','DeWalt','Em uso',''],['LXG-001','Lixadeira Grande 9"','DeWalt','Em uso',''],['LXG-002','Lixadeira Grande 9"','Makita','Disponível',''],['BAT-001','Bateria','DeWalt','Em uso',''],['BAT-006','Bateria','DeWalt','Disponível',''],['RBT-001','Rebitadeira','UZZY','Em uso','Sidney'],['CRG-001','Carregador de Bateria','DeWalt','Em uso',''],['RTF-001','Retífica Manual','Makita','Manutenção',''],['PFE-001','Parafusadeira Elétrica','DeWalt','Em uso','Marcio'],['MSE-001','Máquina de Solda por Eletrodo','Kraw','Em uso',''],['SCI-001','Serra Circular','DeWalt','Disponível','']
].map(x=>({code:x[0],name:x[1],brand:x[2],status:x[3],holder:x[4]}));
let page='home',selected=tools[0].code,requests=[],history=[],scanner=null;
const main=document.querySelector('#main'),nav=document.querySelector('#nav');
let cameraStream=null, scanFrame=null, detector=null, scanning=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tool=code=>tools.find(t=>t.code===code);const pending=()=>requests.filter(r=>r.status==='Pendente');
function stopCamera(){scanning=false;if(scanFrame!==null){cancelAnimationFrame(scanFrame);scanFrame=null}if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}const v=document.querySelector('#cameraVideo');if(v){v.pause();v.srcObject=null}}
function detail(t){if(!t)return '<div class="card">Código não encontrado na lista demonstrativa. Confira o cadastro.</div>';return `<div class="card"><div class="muted">CÓDIGO DA FERRAMENTA</div><div class="metric">${esc(t.code)}</div><b>${esc(t.name)}</b><div class="muted">${esc(t.brand)}</div><p>Situação: <b>${esc(t.status)}</b><br>Responsável atual: <b>${esc(t.holder||'Não informado')}</b></p><button class="primary" data-request="${esc(t.code)}">Solicitar transferência desta ferramenta</button></div>`}
function render(){stopCamera();nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
if(page==='home')main.innerHTML=`<h2>Painel geral</h2><div class="grid"><div class="card"><div class="metric">${tools.length}</div><div class="muted">Ferramentas de demonstração</div></div><div class="card"><div class="metric">${tools.filter(t=>t.status==='Em uso').length}</div><div class="muted">Marcadas em uso</div></div><div class="card"><div class="metric">${tools.filter(t=>t.status==='Disponível').length}</div><div class="muted">Disponíveis</div></div><div class="card"><div class="metric">${pending().length}</div><div class="muted">Solicitações pendentes</div></div></div><div class="card"><b>Regra definida para a Sulfer</b><p>Todas as transferências precisam ser aprovadas pelo almoxarifado. O almoxarifado pode intervir em pendências, sempre registrando justificativa, usuário e data/hora.</p></div><div class="note">Use “Ler QR Code” para testar a câmera do celular ou digite o código manualmente. Para testar uma aprovação, crie uma solicitação e abra “Aprovações”.</div>`;
if(page==='tools')main.innerHTML=`<h2>Consultar ferramentas</h2><input id="search" placeholder="Pesquisar código, nome ou marca"><div id="results">${tools.map(t=>`<div class="row"><span><b>${esc(t.code)} — ${esc(t.name)}</b><div class="muted">${esc(t.brand)} · ${esc(t.status)} · ${esc(t.holder||'Sem responsável informado')}</div></span><button data-open="${esc(t.code)}">Abrir</button></div>`).join('')}</div><div id="detail"></div>`;
if(page==='qr')main.innerHTML=`<h2>Leitura pela câmera</h2><div class="note">Permita o acesso à câmera quando o navegador perguntar. Aponte para uma etiqueta QR da Sulfer. A câmera exige HTTPS ou localhost. O leitor utiliza o decodificador nativo do navegador, sem baixar bibliotecas externas. Se o navegador não oferecer leitura nativa de QR, use a digitação manual ou teste no Chrome atualizado para Android.</div><video id="cameraVideo" autoplay playsinline muted style="display:block;width:100%;max-width:440px;max-height:55vh;object-fit:cover;background:#111;border-radius:12px;margin:10px auto"></video><button class="primary" id="startCam">Ativar câmera</button><button id="stopCam" style="width:100%;margin-top:7px">Parar câmera</button><p id="cammsg" class="muted"></p><label>Ou digite o código da etiqueta</label><input id="manualCode" placeholder="Ex.: LXP-001"><button id="manualRead" class="primary">Localizar pelo código</button><div id="qrresult"></div>`;
if(page==='request')main.innerHTML=`<h2>Nova solicitação de transferência</h2><label>Código da ferramenta</label><select id="reqCode">${tools.map(t=>`<option value="${esc(t.code)}" ${t.code===selected?'selected':''}>${esc(t.code)} — ${esc(t.name)}</option>`).join('')}</select><div id="reqDetail">${detail(tool(selected))}</div><label>Quem está solicitando?</label><input id="requester" placeholder="Nome do funcionário solicitante"><label>Responsável atual / quem entrega</label><input id="from" value="${esc(tool(selected)?.holder||'')}" placeholder="Nome de quem está com a ferramenta"><label>Novo responsável / quem receberá</label><input id="to" placeholder="Nome de quem receberá"><label>Setor ou equipe</label><input id="sector" placeholder="Ex.: Montagem"><label>Observação (opcional)</label><textarea id="obs" placeholder="Informações adicionais"></textarea><button class="primary" id="sendReq">Enviar para aprovação do almoxarifado</button><p class="muted">A ferramenta não muda de responsável até a aprovação do almoxarifado.</p>`;
if(page==='approval')main.innerHTML=`<h2>Painel do almoxarifado</h2><div class="note"><b>Acesso previsto:</b> somente pessoal autorizado do almoxarifado, com login individual. Nesta demonstração, o painel está aberto para avaliação e não possui autenticação real.</div><h3>Solicitações pendentes (${pending().length})</h3>${pending().map(r=>`<div class="card"><div class="row"><b>${esc(r.code)} — ${esc(tool(r.code)?.name||'Ferramenta')}</b><span class="tag warn">Pendente</span></div><p><b>Solicitante:</b> ${esc(r.requester)}<br><b>Entrega:</b> ${esc(r.from)}<br><b>Recebimento:</b> ${esc(r.to)}<br><b>Setor:</b> ${esc(r.sector||'Não informado')}<br><b>Enviada:</b> ${esc(r.date)}</p>${r.obs?`<p class="muted">${esc(r.obs)}</p>`:''}<label>Justificativa (obrigatória para rejeitar ou intervir)</label><textarea id="why-${r.id}" placeholder="Motivo da decisão ou intervenção"></textarea><div class="actions"><button class="primary" data-approve="${r.id}">Aprovar transferência</button><button class="danger" data-reject="${r.id}">Rejeitar</button></div></div>`).join('')||'<div class="card muted">Nenhuma solicitação aguardando aprovação.</div>'}<h3 class="sectiontitle">Intervenção administrativa</h3><div class="card"><label>Ferramenta</label><select id="adminCode">${tools.map(t=>`<option value="${esc(t.code)}">${esc(t.code)} — ${esc(t.name)}</option>`).join('')}</select><label>Novo responsável / situação</label><input id="adminHolder" placeholder="Nome do responsável (ou deixe em branco)"><label>Justificativa obrigatória</label><textarea id="adminWhy" placeholder="Descreva por que o almoxarifado está ajustando o registro"></textarea><button id="adminSave" class="primary">Registrar intervenção</button></div>`;
if(page==='history')main.innerHTML=`<h2>Histórico de movimentações</h2>${history.slice().reverse().map(h=>`<div class="row"><span><b>${esc(h.code)} — ${esc(h.action)}</b><div>${esc(h.from||'')} ${h.to?'→ '+esc(h.to):''}</div><div class="muted">${esc(h.date)} · ${esc(h.by)}</div><div class="muted">Justificativa: ${esc(h.why||'Não se aplica')}</div></span><span class="tag ${h.action==='Aprovada'?'ok':h.action==='Rejeitada'?'danger':''}">${esc(h.action)}</span></div>`).join('')||'<p class="muted">Nenhum registro nesta sessão de demonstração.</p>'}`;
}
function lookup(code){selected=(code||'').trim().toUpperCase();const t=tool(selected);document.querySelector('#qrresult').innerHTML=detail(t);if(t){document.querySelector('#manualCode').value=selected}}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const q=e.target.value.toLowerCase();document.querySelector('#results').innerHTML=tools.filter(t=>(t.code+t.name+t.brand).toLowerCase().includes(q)).map(t=>`<div class="row"><span><b>${esc(t.code)} — ${esc(t.name)}</b><div class="muted">${esc(t.brand)} · ${esc(t.status)}</div></span><button data-open="${esc(t.code)}">Abrir</button></div>`).join('')}});
document.addEventListener('change',e=>{if(e.target.id==='reqCode'){selected=e.target.value;document.querySelector('#reqDetail').innerHTML=detail(tool(selected));document.querySelector('#from').value=tool(selected)?.holder||''}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.open){document.querySelector('#detail').innerHTML=detail(tool(b.dataset.open))}
if(b.dataset.request){selected=b.dataset.request;page='request';render()}
if(b.id==='manualRead'){lookup(document.querySelector('#manualCode').value)}
if(b.id==='startCam'){const msg=document.querySelector('#cammsg');b.disabled=true;msg.textContent='Verificando leitor nativo e solicitando acesso à câmera...';try{if(!('BarcodeDetector' in window))throw new Error('Este navegador não oferece leitor QR nativo. Atualize o Chrome ou digite o código manualmente.');if(!navigator.mediaDevices?.getUserMedia)throw new Error('A câmera exige HTTPS e permissão do navegador. Abra o site por um endereço seguro (HTTPS).');detector=new BarcodeDetector({formats:['qr_code']});cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=document.querySelector('#cameraVideo');video.srcObject=cameraStream;await video.play();scanning=true;msg.textContent='Câmera ativa. Aponte para o QR Code da ferramenta.';const scan=async()=>{if(!scanning||!video||video.readyState<2){if(scanning)scanFrame=requestAnimationFrame(scan);return}try{const codes=await detector.detect(video);if(codes.length&&codes[0].rawValue){const value=codes[0].rawValue;stopCamera();lookup(value);const m=document.querySelector('#cammsg');if(m)m.textContent='QR Code lido: '+value;return}}catch(err){console.warn('Falha na leitura do quadro',err)}if(scanning)scanFrame=requestAnimationFrame(scan)};scan()}catch(err){stopCamera();const reason=err.name==='NotAllowedError'?'Permissão da câmera negada. Libere o acesso nas configurações do navegador.':err.name==='NotFoundError'?'Nenhuma câmera foi encontrada neste aparelho.':err.name==='NotReadableError'?'A câmera está ocupada por outro aplicativo. Feche-o e tente novamente.':(err.message||String(err));msg.textContent='Leitor/câmera indisponível: '+reason+' Você também pode digitar o código abaixo.'}finally{b.disabled=false}}
if(b.id==='stopCam'){stopCamera();const m=document.querySelector('#cammsg');if(m)m.textContent='Câmera parada.'}
if(b.id==='sendReq'){const get=id=>document.getElementById(id).value.trim();const code=get('reqCode'),from=get('from'),to=get('to'),requester=get('requester');if(!requester||!from||!to){alert('Preencha solicitante, quem entrega e quem recebe.');return}if(pending().some(r=>r.code===code)){alert('Esta ferramenta já possui uma solicitação pendente.');return}requests.push({id:Date.now().toString(),code,requester,from,to,sector:get('sector'),obs:get('obs'),date:new Date().toLocaleString('pt-BR'),status:'Pendente'});history.push({code,action:'Solicitação criada',from,to,by:requester,date:new Date().toLocaleString('pt-BR'),why:'Enviada para análise do almoxarifado'});alert('Solicitação enviada ao painel do almoxarifado.');page='approval';render()}
if(b.dataset.approve){const r=requests.find(x=>x.id===b.dataset.approve);if(!r)return;const t=tool(r.code);if(t){t.holder=r.to;t.status='Em uso'}r.status='Aprovada';history.push({code:r.code,action:'Aprovada',from:r.from,to:r.to,by:'Almoxarifado (demonstração)',date:new Date().toLocaleString('pt-BR'),why:'Aprovação do almoxarifado'});render()}
if(b.dataset.reject){const r=requests.find(x=>x.id===b.dataset.reject),why=document.querySelector('#why-'+b.dataset.reject)?.value.trim();if(!why){alert('Informe a justificativa para rejeitar.');return}r.status='Rejeitada';history.push({code:r.code,action:'Rejeitada',from:r.from,to:r.to,by:'Almoxarifado (demonstração)',date:new Date().toLocaleString('pt-BR'),why});render()}
if(b.id==='adminSave'){const code=document.querySelector('#adminCode').value,holder=document.querySelector('#adminHolder').value.trim(),why=document.querySelector('#adminWhy').value.trim();if(!why){alert('A justificativa é obrigatória.');return}const t=tool(code);const old=t.holder;t.holder=holder;t.status=holder?'Em uso':'Disponível';history.push({code,action:'Intervenção administrativa',from:old,to:holder,by:'Almoxarifado (demonstração)',date:new Date().toLocaleString('pt-BR'),why});alert('Intervenção registrada no histórico desta demonstração.');render()}
});render();
</script></body></html>
